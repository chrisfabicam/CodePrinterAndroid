# =====================================================
# CodePrinter Android - Build APKs en GitHub Actions
# =====================================================
# Compila las dos apps (operador y printserver) y sube los APK debug
# como artifacts descargables desde la pestaña "Actions" del repo.
#
# ESTRUCTURA DEL PROYECTO:
#   .
#   ├── operador/      <- proyecto Gradle independiente (settings.gradle.kts propio)
#   │   └── app/
#   └── printserver/   <- proyecto Gradle independiente (settings.gradle.kts propio)
#       └── app/
#
# Cada app se compila por separado con su propio gradlew.
#
# PARA AJUSTAR:
#   - Si agregás flavors: cambiá `assembleDebug` por `assemble<Flavor>Debug`
#   - Si querés release firmado: agregá los secrets (KEYSTORE_BASE64,
#     KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) y usá `assembleRelease`
#   - Si cambiás la versión de JDK: ajustá `java-version` (debe coincidir
#     con `compileOptions`/`kotlinOptions` de los build.gradle.kts)

name: Build Android APKs

on:
  # Se ejecuta al hacer push a main/master
  push:
    branches: [ main, master ]
  # Permite lanzarlo manualmente desde la pestaña Actions
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      # 1) Traer el código del repo
      - name: Checkout
        uses: actions/checkout@v5

      # 2) Configurar JDK 17 (requerido por AGP 8.x y Kotlin 1.9)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3) Configurar Android SDK
      #    NO usamos android-actions/setup-android@v3 porque intenta instalar
      #    el paquete legacy 'tools' (ya eliminado de los repos de Google) y
      #    falla con "Failed to find package 'tools'".
      #    En su lugar, instalamos explícitamente lo que necesita el proyecto.
      - name: Set up Android SDK
        run: |
          # El runner de ubuntu-latest ya trae el SDK en esta ruta
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

          # Localizar sdkmanager (la ruta cambia según la versión del runner)
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager no encontrado, instalando cmdline-tools..."
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd /tmp
            curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" 2>/dev/null || true
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $SDKMGR"

          # Aceptar licencias e instalar SOLO los paquetes necesarios
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          echo "SDK instalado:"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      # 4) Cachear Gradle para acelerar builds sucesivos
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5) Dar permisos de ejecución a los wrappers
      - name: Make gradlew executable
        run: |
          chmod +x operador/gradlew
          chmod +x printserver/gradlew

      # 6) Compilar la app Operador (proyecto independiente)
      - name: Build Operador (debug)
        working-directory: operador
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # 7) Compilar la app PrintServer (proyecto independiente)
      - name: Build PrintServer (debug)
        working-directory: printserver
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # 8) Subir el APK del Operador como artifact
      - name: Upload Operador APK
        uses: actions/upload-artifact@v4
        with:
          name: operador-debug-apk
          path: operador/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 9) Subir el APK del PrintServer como artifact
      - name: Upload PrintServer APK
        uses: actions/upload-artifact@v4
        with:
          name: printserver-debug-apk
          path: printserver/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
